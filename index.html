ي خطوة تعزز مكانة المركز في الجراحات المتقدمة.",body:["أعلن المركز الطبي العالمي نجاح أول جراحة قلب بالمنظار ثلاثي الأبعاد، بعد تدخل دقيق نفّذه فريق جراحي متكامل بمشاركة أطباء التخدير والعناية المركزة.","أوضح الفريق الطبي أن التقنية الجديدة تمنح الجرّاح رؤية أوضح للأنسجة وتقلل الشقوق الجراحية، ما ينعكس على تقليل الألم وتسريع التعافي وعودة المريض إلى حياته الطبيعية.","وأضاف المركز أن هذه الخطوة تأتي ضمن خطة لتوسيع الجراحات الدقيقة وتدريب الكوادر الطبية على أحدث التقنيات المعتمدة عالمياً."],source:"المركز الطبي العالمي",time:"منذ ساعتين",dateLabel:"نوفمبر 2026",views:"12,480",emoji:"\uD83E\uDEC0",gradient:"linear-gradient(135deg,#BE123C,#0B2A4A)",breaking:!0},{id:102,category:"طب",title:"دراسة جديدة: دواء واعد يحسّن ضبط سكر الدم لدى مرضى السكري من النوع الثاني",summary:"نتائج أولية مشجعة لعلاج جديد يجمع بين ضبط السكر وحماية القلب والكلى، مع متابعة دقيقة للسلامة والآثار الجانبية.",body:["أظهرت دراسة سريرية جديدة تحسناً ملحوظاً في ضبط سكر الدم لدى مرضى السكري من النوع الثاني الذين تلقوا العلاج الجديد ضمن بروتوكول علاجي محدد.","أشار الباحثون إلى أن العلاج الجديد قد يساعد أيضاً في دعم صحة القلب والكلى، مع التأكيد على أن النتائج لا تزال بحاجة إلى متابعة أطول ومجموعات أكبر من المرضى.","ودعا فريق الدراسة المرضى إلى عدم تغيير أدويتهم دون استشارة الطبيب المعالج، والالتزام بالمتابعة الدورية والنظام الغذائي والنشاط البدني."],source:"مجلة لانست",time:"منذ 3 ساعات",dateLabel:"نوفمبر 2026",views:"9,860",emoji:"\uD83D\uDC89",gradient:"linear-gradient(135deg,#0F766E,#0B2A4A)"},{id:103,category:"تكنولوجيا طبية",title:"الذكاء الاصطناعي يرفع دقة الكشف المبكر عن السرطان في دراسة حديثة",summary:"نموذج ذكاء اصطناعي يساعد الأطباء على رصد علامات مبكرة في الصور الطبية، مع التأكيد على أن القرار النهائي يبقى بيد الطبيب.",body:["أظهرت دراسة حديثة أن نموذجاً للذكاء الاصطناعي ساعد في رفع دقة رصد العلامات المبكرة لبعض الأورام عند تحليل الصور الطبية.","أكد الباحثون أن التقنية تعمل كمساعد للطبيب وليست بديلاً عنه، إذ يراجع الطبيب النتائج ويقارنها بالفحوص السريرية والتاريخ المرضي.","ويرى الفريق أن إدماج هذه الأدوات في المستشفيات قد يختصر وقت التشخيص ويحسّن فرص التدخل المبكر عند الحاجة."],source:"مجلة نيتشر الطبية",time:"منذ 4 ساعات",dateLabel:"نوفمبر 2026",views:"11,240",emoji:"\uD83E\uDD16",gradient:"linear-gradient(135deg,#7C3AED,#0B2A4A)",breaking:!0},{id:104,category:"صحة عامة",title:"منظمة الصحة العالمية تحدّث إرشادات الوقاية من أمراض الجهاز التنفسي",summary:"تحديث يشدد على التهوية الجيدة والتطعيم والفحص المبكر، مع نصائح عملية للمدارس وأماكن العمل والمنشآت الصحية.",body:["أصدرت منظمة الصحة العالمية تحديثاً لإرشادات الوقاية من أمراض الجهاز التنفسي، يشدد على أهمية التهوية الجيدة والنظافة التنفسية والتطعيم للفئات الأكثر عرضة للخطر.","تضمن التحديث توصيات عملية للمدارس وأماكن العمل، منها مراقبة الأعراض والفحص المبكر والالتزام بالعزل المؤقت عند المرض.","ودعت المنظمة المنشآت الصحية إلى تعزيز التوعية ومتابعة المؤشرات الوبائية واتخاذ إجراءات وقائية متناسبة مع كل مرحلة."],source:"منظمة الصحة العالمية",time:"منذ 5 ساعات",dateLabel:"نوفمبر 2026",views:"8,410",emoji:"\uD83C\uDF0D",gradient:"linear-gradient(135deg,#0369A1,#0F766E)"},{id:105,category:"أبحاث",title:"تقدّم جديد في أبحاث اللقاحات ضد الفيروسات التنفسية",summary:"باحثون يختبرون لقاحاً يستهدف استجابة مناعية أوسع، في خطوة قد تقلل شدة العدوى وتدعم الحماية طويلة المدى.",body:["يعمل فريق بحثي على تطوير لقاح يستهدف استجابة مناعية أوسع ضد الفيروسات التنفسية، من خلال تحفيز أكثر من خط دفاع في الجهاز المناعي.","أظهرت النتائج الأولية استجابة مناعية مشجعة في المراحل المبكرة، مع استمرار تقييم السلامة والجرعات ومدى استمرار الحماية.","وأكد الباحثون أن الوصول إلى لقاح معتمد يتطلب مراحل إضافية ومراجعات تنظيمية دقيقة قبل إتاحته للاستخدام العام."],source:"مجلة لانست",time:"منذ 6 ساعات",dateLabel:"نوفمبر 2026",views:"7,935",emoji:"\uD83E\uDDEA",gradient:"linear-gradient(135deg,#DB2777,#7C3AED)"},{id:106,category:"جراحة",title:"الجراحة الروبوتية تختصر فترة التعافي بعد جراحات البطن الدقيقة",summary:"تقنيات روبوتية تمنح الجرّاح تحكماً أدق وحركات أثبت، وتقلل فقدان الدم ومدة الإقامة في المستشفى.",body:["أظهرت تجربة سريرية حديثة أن الجراحة الروبوتية في بعض جراحات البطن الدقيقة أسهمت في تقليل فقدان الدم وتقصير مدة الإقامة في المستشفى مقارنة بالأساليب التقليدية.","وأوضح الجراحون أن الأنظمة الروبوتية تمنح تحكماً أدق ورؤية مكبّرة، مع الحفاظ على مبادئ السلامة الجراحية والتعقيم.","وأشار الفريق إلى أن اختيار التقنية يعتمد على حالة المريض وتقييم الطبيب، وليس على التقنية وحدها."],source:"المركز الطبي العالمي",time:"منذ 7 ساعات",dateLabel:"نوفمبر 2026",views:"6,720",emoji:"\uD83E\uDDBE",gradient:"linear-gradient(135deg,#0B2A4A,#0369A1)"},{id:107,category:"أبحاث",title:"دراسة جديدة تربط النوم الجيد بتباطؤ التغيرات المرتبطة بالزهايمر",summary:"باحثون يرصدون علاقة بين جودة النوم وصحة الدماغ، ويؤكدون أن النوم ليس رفاهية بل جزء من الوقاية العصبية.",body:["رصدت دراسة حديثة علاقة بين جودة النوم المنتظم وبعض المؤشرات المرتبطة بصحة الدماغ لدى كبار السن.","أشار الباحثون إلى أن اضطرابات النوم قد ترتبط بتراكم بعض التغيرات العصبية، بينما يرتبط النوم الجيد بدعم عمليات تنظيف الدماغ والذاكرة.","وأكد الفريق أن هذه النتائج لا تعني أن النوم وحده يمنع المرض، لكنها تشجع على معالجة اضطرابات النوم مبكراً واتباع روتين نوم صحي."],source:"مجلة نيتشر الطبية",time:"منذ 8 ساعات",dateLabel:"نوفمبر 2026",views:"10,150",emoji:"\uD83E\uDDE0",gradient:"linear-gradient(135deg,#7C3AED,#BE123C)"},{id:108,category:"صحة عامة",title:"التغذية المتوازنة والمناعة: ما الذي تقوله الأدلة الحديثة؟",summary:"خبراء تغذية يؤكدون أن التنوع الغذائي والبروتين الكافي والنوم والنشاط البدني أهم من أي مكمل واحد.",body:["أكد خبراء التغذية أن دعم المناعة يبدأ من نمط حياة متكامل، يشمل الغذاء المتنوع والبروتين الكافي والخضروات والفواكه والدهون الصحية.","وأوضح الخبراء أن المكملات قد تكون مفيدة في حالات النقص المثبتة فقط، ولا تغني عن الغذاء المتوازن أو المتابعة الطبية.","ونصح الفريق بالحفاظ على النوم الكافي والنشاط البدني وشرب الماء، ومراجعة الطبيب قبل بدء أي مكمل غذائي."],source:"مجلة التغذية السريرية",time:"منذ 9 ساعات",dateLabel:"نوفمبر 2026",views:"5,980",emoji:"\uD83E\uDD57",gradient:"linear-gradient(135deg,#047857,#84CC16)"},{id:109,category:"أبحاث",title:"مؤتمر القاهرة الطبي يجمع خبراء من 20 دولة لمناقشة مستقبل الرعاية الصحية",summary:"جلسات حول الذكاء الاصطناعي والجراحة الدقيقة وطب الأطفال، ومعرض لأحدث الابتكارات الطبية.",body:["انطلقت في القاهرة فعاليات المؤتمر الطبي الدولي بمشاركة خبراء من عشرين دولة، لمناقشة مستقبل الرعاية الصحية والابتكار الطبي.","تضمنت الجلسات محاور حول الذكاء الاصطناعي في التشخيص والجراحة الدقيقة وطب الأطفال والرعاية المتكاملة للمرضى.","واختتم المؤتمر بتوصيات تدعو إلى تعزيز التعاون البحثي وتبادل الخبرات وتدريب الكوادر الطبية على التقنيات الحديثة."],source:"المركز الطبي العالمي",time:"منذ 10 ساعات",dateLabel:"نوفمبر 2026",views:"7,120",emoji:"\uD83C\uDFDB️",gradient:"linear-gradient(135deg,#B45309,#0B2A4A)"},{id:110,category:"صيدلة",title:"دواء جديد للضغط يعتمد على جرعة يومية واحدة ويحسّن الالتزام بالعلاج",summary:"تركيبة دوائية جديدة تهدف إلى تبسيط العلاج وتقليل النسيان، مع متابعة دقيقة لضغط الدم والآثار الجانبية.",body:["أعلن فريق صيدلي عن تركيبة دوائية جديدة لعلاج ارتفاع ضغط الدم تعتمد على جرعة يومية واحدة، بهدف تبسيط العلاج وتحسين الالتزام به.","أظهرت النتائج الأولية ضبطاً جيداً لضغط الدم لدى شريحة من المرضى، مع استمرار تقييم السلامة على المدى الطويل.","وأكد الصيادلة أن تغيير العلاج يجب أن يتم بإشراف الطبيب، مع قياس الضغط بانتظام واتباع نمط حياة صحي."],source:"مجلة الصيدلة السريرية",time:"منذ 11 ساعة",dateLabel:"نوفمبر 2026",views:"6,430",emoji:"\uD83D\uDC8A",gradient:"linear-gradient(135deg,#0E7490,#0F766E)"},{id:111,category:"طب",title:"بروتوكول جديد لمتابعة مرضى القلب بعد الخروج من المستشفى",summary:"متابعة رقمية وزيارات منظمة تقلل عودة المرضى إلى الطوارئ وتحسّن جودة حياتهم اليومية.",body:["أطلق المركز الطبي العالمي بروتوكولاً جديداً لمتابعة مرضى القلب بعد الخروج من المستشفى، يجمع بين المتابعة الرقمية والزيارات المنظمة والتثقيف الصحي.","وأظهرت المتابعة الأولية انخفاضاً في زيارات الطوارئ غير المخطط لها، وتحسناً في التزام المرضى بالأدوية والنشاط البدني.","وأكد الفريق أن نجاح البروتوكول يعتمد على التواصل الواضح بين المريض والطبيب والأسرة، والتدخل المبكر عند ظهور أي أعراض."],source:"المركز الطبي ا
